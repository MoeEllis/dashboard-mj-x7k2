name: Dashboard aktualisieren

on:
  schedule:
    - cron: "*/30 * * * *"   # alle 30 Minuten
  workflow_dispatch:          # manueller Start (⟳-Knopf / "Run workflow")
    inputs:
      close_tasks:
        description: "Todoist-IDs zum Abschließen (kommagetrennt; setzt das Dashboard beim Abhaken selbst)"
        required: false
        default: ""
      it_progress:
        description: "Italienisch-Lernstand als JSON (setzt das Dashboard beim Lernen selbst)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - build_dashboard.py
      - italian_course.py
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: dashboard-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests icalendar recurring-ical-events cryptography

      - name: Dashboard bauen und verschlüsseln
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          ICS_URLS: ${{ secrets.ICS_URLS }}
          HOLIDAY_EXCLUDE: ${{ secrets.HOLIDAY_EXCLUDE }}
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          # Aufgaben, die im Dashboard abgehakt wurden (leer bei Zeitplan/Push)
          CLOSE_TASKS: ${{ github.event.inputs.close_tasks }}
          # Italienisch-Lernstand vom Gerät, das gerade gelernt hat (leer bei Zeitplan/Push)
          IT_SYNC: ${{ github.event.inputs.it_progress }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_MODEL: ${{ secrets.PODCAST_MODEL }}
          # --- Markt: Releases-Einordnung (alle optional, sinnvolle Vorgaben im Skript) ---
          OWN_BRANDS: ${{ secrets.OWN_BRANDS }}
          WATCH_LEAGUES: ${{ secrets.WATCH_LEAGUES }}
          # --- Markt: Branchen- und Lizenz-Radar (alle optional) ---
          INDUSTRY_FEEDS: ${{ secrets.INDUSTRY_FEEDS }}
          INDUSTRY_KEYWORDS: ${{ secrets.INDUSTRY_KEYWORDS }}
        run: python build_dashboard.py

      - name: Veröffentlichen (nur bei Änderung)
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cache/ 2>/dev/null || git add index.html
          git diff --cached --quiet || (git commit -m "Dashboard aktualisiert ($(TZ=Europe/Berlin date +'%d.%m. %H:%M') Uhr)" && git push)
